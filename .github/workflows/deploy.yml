name: Build & Deploy vers OVH

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2

      - name: Installer les dépendances
        run: bun install

      - name: Générer la veille réglementaire (RSS → JSON)
        run: node fetch-rss.mjs

      - name: Compiler le site
        run: bun run build

      - name: Vérifier dist/data/veille.json
        run: |
          ls -la dist/data/veille.json || echo "Fichier manquant !"
          cat dist/data/veille.json | head -n 20

      - name: Déployer vers OVH par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: www/
